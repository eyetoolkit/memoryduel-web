    <style>
  /* ═══════════════════════════════════════════════════════════════
     MemoryDuel 对战页 · 重设计皮肤（redesign-package 落地版）
     ---------------------------------------------------------------
     真源依据：design/memoryduel-game.html（重设计交付包）
     落地约束（README §4）：CSP font-src 'self' → 字体走 tokens.css 自托管
       （Space Grotesk 400/700 · Inter 400/500/700 · JetBrains Mono 500/700）；
       白字压品牌一律 #C2410C；AI 对手用跨站商标靛蓝 #4F46E5。
     红线：JS 对战引擎（battle IIFE）一行未动，所有 id/class 契约保留。
     ═══════════════════════════════════════════════════════════════ */
  :root{
    --orange:#EA580C; --orange-deep:#C2410C; --orange-bright:#F97316;
    --paper:#FAF6F1; --card:#fff; --ink:#1C1408; --mute:#6B5A45; --line:#EAD9C7;
    --amber:#F59E0B; --green:#22C55E; --red:#DC2626; --indigo-sig:#4F46E5;
    --disp:'Space Grotesk',system-ui,sans-serif;
    --ui:'Inter',system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --rd:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  :focus-visible{outline:2px solid var(--orange);outline-offset:3px}

  /* ===== 对战舞台：暖纸 + 网格 + 橙色氤氲（与首页同源） ===== */
  /* [2026-10-09 沉浸增强] safe-area + 动态视口高度：避免刘海/灵动岛/Home Indicator
     遮挡内容；min-height:100dvh（带 100vh 回退）让移动端工具栏收起后仍占满屏。 */
  .battle-stage{
    position:fixed; inset:0; z-index:1000; display:none;
    background-color:var(--paper);
    background-image:
      radial-gradient(circle at 16% 12%,rgba(234,88,12,.06) 0,transparent 42%),
      radial-gradient(circle at 86% 80%,rgba(245,158,11,.05) 0,transparent 40%),
      linear-gradient(rgba(180,120,60,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(180,120,60,.05) 1px,transparent 1px);
    background-size:100% 100%,100% 100%,32px 32px,32px 32px;
    background-attachment:fixed;
    overflow-y:auto; -webkit-font-smoothing:antialiased; color:var(--ink);
    /* 安全区：左右/底部留出，桌面端 env() 取 0 不占空间 */
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .battle-stage.active{display:flex; flex-direction:column; align-items:center; min-height:100vh; min-height:100dvh}

  /* 顶栏：返回 / 模式 / 回合 / 计时 */
  .battle-top{
    position:sticky; top:0; width:100%; max-width:720px;
    display:flex; align-items:center; gap:12px;
    /* [2026-10-09 沉浸增强] 顶部安全区：贴着刘海/灵动岛下沿，不进内容 */
    padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
    background:rgba(250,246,241,.86); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); z-index:2;
  }
  .battle-back{font-size:24px; font-weight:700; color:var(--mute); text-decoration:none; padding:2px 10px; border-radius:10px; line-height:1}
  .battle-back:hover{color:var(--orange-deep); background:rgba(234,88,12,.08)}
  .battle-pill{font-weight:700; font-size:13px; background:#FFF6F0; color:var(--orange-deep); padding:6px 13px; border-radius:999px; border:1px solid var(--line); font-family:var(--disp); white-space:nowrap}
  .battle-spacer{flex:1}
  .battle-round{font-family:var(--mono); font-weight:700; font-size:13px; color:var(--mute); white-space:nowrap}
  .battle-round b{color:var(--orange-deep); font-size:15px}
  .battle-timer{display:flex; align-items:center; gap:9px}
  .battle-timer .timer-val{font-family:var(--mono); font-weight:700; font-size:14px; color:var(--orange-deep); min-width:26px; text-align:right}
  .battle-timer .timer-bar{width:84px; height:8px; border-radius:999px; background:var(--line); overflow:hidden}
  .battle-timer .timer-fill{display:block; height:100%; width:100%; background:var(--amber); transition:width .2s linear}
  .battle-timer .timer-fill.warn{background:var(--red)}

  /* 主卡 */
  .battle-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--rd);
    box-shadow:0 18px 44px rgba(120,70,20,.10);
    max-width:720px; width:100%; padding:24px; margin:20px auto 40px;
  }

  /* 记分板 */
  .battle-scores{display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; margin-bottom:18px}
  .score-card{display:flex; align-items:center; gap:11px; background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:12px 14px}
  .score-card.bot{flex-direction:row-reverse; text-align:right}
  .score-card .av{width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; font-size:16px; font-family:var(--disp); flex:none}
  .score-card .av.you{background:var(--orange)}
  .score-card .av.ai{background:var(--indigo-sig); font-size:20px}
  .score-meta{min-width:0}
  .score-name{font-size:13px; color:var(--mute); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .score-val{font-family:var(--mono); font-weight:700; font-size:24px; color:var(--orange-deep); line-height:1.1}
  .vs-badge{background:var(--orange); color:#fff; padding:6px 12px; border-radius:999px; font-size:12px; font-weight:700; font-family:var(--disp)}

  /* 题干 */
  .battle-question{font-family:var(--disp); font-weight:700; font-size:clamp(19px,3.2vw,26px); line-height:1.22; letter-spacing:-.01em; margin:6px 0 20px; min-height:54px}

  /* 选项 */
  .battle-options{display:grid; grid-template-columns:1fr 1fr; gap:11px}
  .battle-opt{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    border:2px solid var(--line); background:#fff; border-radius:14px;
    padding:14px 16px; font-size:15px; font-weight:600; color:var(--ink); cursor:pointer;
    font-family:var(--ui); transition:transform .1s,border-color .1s,background .1s;
  }
  .battle-opt:hover:not(:disabled){transform:translateY(-1px); border-color:var(--orange); background:#FFF6F0}
  .battle-opt:disabled{cursor:default; opacity:.92}
  .battle-opt .opt-letter{width:28px; height:28px; border-radius:50%; background:rgba(234,88,12,.1); color:var(--orange-deep); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; font-family:var(--mono); flex:none}
  .battle-opt.correct{border-color:var(--green); background:rgba(34,197,94,.14)}
  .battle-opt.correct .opt-letter{background:var(--green); color:#fff}
  .battle-opt.wrong{border-color:var(--red); background:rgba(220,38,38,.08)}
  .battle-opt.wrong .opt-letter{background:var(--red); color:#fff}

  /* 解释 / 思考 / 操作 */
  .battle-explain{margin-top:14px; padding:12px 14px; background:rgba(234,88,12,.07); border-radius:12px; font-size:13px; color:var(--mute); line-height:1.5; display:none}
  .battle-explain.show{display:block}
  .battle-explain b{color:var(--orange-deep)}
  .battle-bot-thinking{text-align:center; padding:12px; color:var(--mute); font-size:13px; font-style:italic}
  .battle-actions{display:flex; gap:10px; justify-content:center; margin-top:18px; flex-wrap:wrap}

  /* 结算（JS 注入：.battle-result .win/.lose/.draw） */
  .battle-result{text-align:center; padding:8px 4px}
  .battle-result h2{font-family:var(--disp); font-weight:700; font-size:30px; margin-bottom:10px}
  .battle-result.win h2{color:var(--green)}
  .battle-result.lose h2{color:var(--red)}
  .battle-result.draw h2{color:var(--mute)}
  .battle-result .score-big{font-family:var(--mono); font-weight:900; font-size:48px; color:var(--orange-deep); margin:14px 0}
  .battle-result p{color:var(--mute); font-size:14px; margin-top:6px}

  /* 按钮（与首页一致：.btn=实心琥珀主按钮，.btn.ghost=描边次按钮） */
  .btn{border:0; font-family:var(--ui); font-weight:700; cursor:pointer; border-radius:12px; font-size:15px; padding:12px 20px; transition:transform .12s,background .12s; display:inline-flex; align-items:center; gap:8px; justify-content:center; background:var(--orange); color:#fff}
  .btn:hover{background:var(--orange-deep); transform:translateY(-1px)}
  .btn.ghost,.btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line)}
  .btn.ghost:hover,.btn-ghost:hover{background:transparent; border-color:var(--orange); color:var(--orange-deep); transform:none}

  @media(max-width:560px){
    /* [2026-10-09 沉浸增强] 移动端顶栏同样保留安全区上沿 */
    .battle-top{padding:calc(10px + env(safe-area-inset-top)) 14px 10px; gap:8px}
    .battle-round{font-size:12px}
    /* 卡片撑满：移动端去掉左右留白，贴齐安全区（stage 已留 safe-area） */
    .battle-card{padding:18px 16px; margin:14px auto 24px; max-width:none}
    .battle-options{grid-template-columns:1fr}
    .battle-question{font-size:19px}
    .score-val{font-size:20px}
    .score-card{padding:10px}
    .score-card .av{width:36px; height:36px; font-size:13px}
    .score-card .av.ai{font-size:16px}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.battle-timer .timer-fill{transition:none!important}}

<script defer src="/js/toast.js?v=p3"></script>

<!-- Battle Engine: real AI / Online duel game logic -->
  <script>
  (function() {
    'use strict';
    // === i18n helpers (T = translate with fallback, zhOnly = return zh fallback if lang=zh) ===
    var T = function (key, fallback) {
      try {
        if (window.__t) return window.__t(key, fallback);
        if (window.t) return window.t(key, fallback);
        if (window.i18n && window.i18n.t) return window.i18n.t(key, fallback);
      } catch (e) {}
      return (fallback != null) ? fallback : key;
    };
    var __t = T;
    var zhOnly = function (zh, en) { return (getLang() === 'zh') ? zh : (en || zh); };

    var params = new URLSearchParams(location.search);
    var mode = params.get('mode');     // 'ai' or 'online'
    var room = params.get('room');     // room code (online)
    var cat  = params.get('cat') || 'general';
    if (!mode && !room) return;        // 直接打开 train.html 时不启动 duel
    // 教师端进房提示（classroom pill）
    if (room) {
      var pill = document.getElementById('classroomPill');
      if (pill) { pill.style.display = 'inline-block'; pill.textContent = '🏫 ' + (window.t ? window.t('md_teacher.classroom_pill', 'Classroom') : 'Classroom') + ' · ' + room; }
    }

    /* ===== Battle 配置 ===== */
    var TOTAL_ROUNDS = 10;
    var PER_QUESTION_MS = 15000;      // 15 秒 / 题
    var BOT_MIN_THINK = 2000;          // 2 秒
    var BOT_MAX_THINK = 9000;          // 9 秒
    var BOT_ACCURACY = 0.62;           // AI 整体正确率（随难度可调）

    var BOT_NAMES_BY_LANG = (function () {
      var m = {};
      ['zh','en','ja','es','fr','de'].forEach(function (l) {
        var v = T('train.bot_names', '');
        m[l] = v ? v.split(',') : [];
      });
      return m;
    })();

    function getLang() {
      /* Prefer URL ?lang= (home always passes it into train). i18n may still be
         null when the inline battle IIFE runs before deferred i18n.js finishes. */
      try {
        var u = params.get('lang');
        if (u) {
          var ul = String(u).split('-')[0].toLowerCase();
          if (['en','zh','ja','es','fr','de'].indexOf(ul) >= 0) return ul;
        }
      } catch (e0) {}
      try {
        if (window.i18n && window.i18n.getLang) {
          var il = window.i18n.getLang();
          if (il) return String(il).split('-')[0].toLowerCase();
        }
      } catch (e1) {}
      return 'en';
    }
    function pickBotName() {
      var list = BOT_NAMES_BY_LANG[getLang()] || BOT_NAMES_BY_LANG.en;
      return list[Math.floor(Math.random() * list.length)];
    }
    function shuffleArr(a) {
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    function ensureQuiz(cb) {
      if (window.MemoryDuelQuiz && window.MemoryDuelQuiz.ready) return cb();
      if (window.MemoryDuelQuiz && window.MemoryDuelQuiz.ensureLoaded) {
        window.MemoryDuelQuiz.ensureLoaded().then(cb).catch(function() {
          showError('Failed to load quiz data. Please refresh and try again.');
        });
        return;
      }
      // quiz-data.js 还没加载：等 memoryduel-quiz-ready
      window.addEventListener('memoryduel-quiz-ready', function once() {
        if (window.MemoryDuelQuiz && window.MemoryDuelQuiz.ensureLoaded) {
          window.MemoryDuelQuiz.ensureLoaded().then(cb).catch(function() {
            showError('Failed to load quiz data. Please refresh and try again.');
          });
        } else {
          showError('Quiz module not loaded. Please refresh and try again.');
        }
      }, { once: true });
    }

    function showError(msg) {
      var stage = document.getElementById('battleStage');
      if (!stage) { alert(msg); return; }
      stage.classList.add('active');
      var card = document.getElementById('battleCard');
      /* 安全：msg 会原样进 innerHTML，而其中一个调用点拼的是 URL 里的 ?cat=
         （train.html:248 取参、:553 拼进提示），未消毒 → 反射型 DOM XSS。
         在 showError 内部统一转义，而不是在每个调用点各自记得转 ——
         少写一次就少漏一次。其余调用点传的是 i18n 文案，不含 &<>"'，不受影响。 */
      card.innerHTML =
        '<div style="text-align:center;padding:40px 20px">' +
          '<h2 style="color:#dc2626;margin-bottom:12px">⚠️ Error</h2>' +
          '<p style="color:#6b7280;margin-bottom:20px">' + escHtml(msg) + '</p>' +
          '<button class="btn" onclick="location.href=\'/\'">Back to Lobby</button>' +
        '</div>';
    }

    /* ===== Battle State ===== */
    var B = {
      questions: [],
      idx: 0,
      youScore: 0,
      botScore: 0,
      timer: null,
      timerStart: 0,
      answered: false,
      botAnswered: false,
      botCorrect: false,
      botThinkTimer: null,
    };

    function startBattle(questions) {
      if (!questions || questions.length === 0) {
        showError('No questions available for this category.');
        return;
      }
      B.questions = shuffleArr(questions.slice(0, Math.max(TOTAL_ROUNDS, questions.length))).slice(0, TOTAL_ROUNDS);
      B.idx = 0;
      B.youScore = 0;
      B.botScore = 0;
      document.getElementById('battleStage').classList.add('active');
      document.getElementById('battleTotal').textContent = B.questions.length;
      document.getElementById('battleBotName').textContent = pickBotName();
      document.getElementById('battleYouName').textContent = T('train.you_label','You');
      updateScores();
      nextQuestion();
    }

    function updateScores() {
      document.getElementById('battleYouScore').textContent = B.youScore;
      document.getElementById('battleBotScore').textContent = B.botScore;
      document.getElementById('battleCur').textContent = (B.idx + 1);
    }

    function nextQuestion() {
      if (B.idx >= B.questions.length) { finishBattle(); return; }
      B.answered = false;
      B.botAnswered = false;
      B.botCorrect = false;

      var q = B.questions[B.idx];
      var lang = getLang();
      // Prefer raw q/options when the bundle was fetched for this UI lang (_rawLang).
      // Avoid qn[lang]||qn.en falling through to a poisoned/mismatched slot.
      var text, options;
      if (q._rawLang && q._rawLang === lang && q.q) {
        text = q.q;
        options = q.options || [];
      } else {
        text = (q.qn && (q.qn[lang] || q.qn.en)) || q.q || '';
        options = (q.op && (q.op[lang] || q.op.en)) || q.options || [];
      }
      var correct = q.ans;

      document.getElementById('battleQuestion').textContent = text;
      document.getElementById('battleExplain').classList.remove('show');
      document.getElementById('battleExplain').innerHTML = '';
      document.getElementById('battleBotThinking').style.display = 'none';
      document.getElementById('battleActions').innerHTML = '';

      var letters = ['A','B','C','D','E','F'];
      var optsHtml = '';
      for (var i = 0; i < options.length; i++) {
        optsHtml +=
          '<button class="battle-opt" data-idx="' + i + '">' +
            '<span class="opt-letter">' + (letters[i] || '?') + '</span>' +
            '<span>' + options[i] + '</span>' +
          '</button>';
      }
      var optsEl = document.getElementById('battleOptions');
      optsEl.innerHTML = optsHtml;
      Array.prototype.forEach.call(optsEl.querySelectorAll('.battle-opt'), function(btn) {
        btn.addEventListener('click', function() { onUserAnswer(parseInt(btn.dataset.idx, 10), correct); });
      });

      startTimer();
      // Bot 同时开始“思考”
      scheduleBotAnswer(correct);
    }

    function startTimer() {
      B.timerStart = Date.now();
      if (B.timer) clearInterval(B.timer);
      var fill = document.getElementById('battleTimerFill');
      var val = document.getElementById('battleTimerVal');
      B.timer = setInterval(function() {
        var elapsed = Date.now() - B.timerStart;
        var left = Math.max(0, PER_QUESTION_MS - elapsed);
        var pct = (left / PER_QUESTION_MS) * 100;
        fill.style.width = pct + '%';
        val.textContent = Math.ceil(left / 1000);
        if (left <= 0) {
          clearInterval(B.timer);
          if (!B.answered) onUserTimeout();
        }
      }, 100);
    }

    function scheduleBotAnswer(correct) {
      if (B.botThinkTimer) clearTimeout(B.botThinkTimer);
      var thinkMs = BOT_MIN_THINK + Math.random() * (BOT_MAX_THINK - BOT_MIN_THINK);
      document.getElementById('battleBotThinking').style.display = 'block';
      B.botThinkTimer = setTimeout(function() {
        document.getElementById('battleBotThinking').style.display = 'none';
        // Bot 答题：正确率 BOT_ACCURACY，否则随机错答
        B.botCorrect = Math.random() < BOT_ACCURACY;
        var q = B.questions[B.idx];
        var options = (q.op && (q.op[getLang()] || q.op.en)) || q.options || [];
        var wrong = [];
        for (var i = 0; i < options.length; i++) if (i !== correct) wrong.push(i);
        var botAnswer = B.botCorrect
          ? correct
          : (wrong.length ? wrong[Math.floor(Math.random() * wrong.length)] : correct);
        var btns = document.querySelectorAll('.battle-opt');
        if (btns[botAnswer] && !B.answered) {
          // 用户还没答：Bot 抢先给分
          if (B.botCorrect) { B.botScore++; updateScores(); }
        }
        // 保存 Bot 的选择，等到 onUserAnswer 高亮
        B._botChoice = botAnswer;
      }, thinkMs);
    }

    function onUserAnswer(idx, correct) {
      if (B.answered) return;
      B.answered = true;
      clearInterval(B.timer);
      if (B.botThinkTimer) { clearTimeout(B.botThinkTimer); B.botThinkTimer = null; }
      document.getElementById('battleBotThinking').style.display = 'none';

      var btns = document.querySelectorAll('.battle-opt');
      if (btns[correct]) btns[correct].classList.add('correct');
      if (idx === correct) B.youScore++;
      else if (btns[idx]) btns[idx].classList.add('wrong');

      Array.prototype.forEach.call(btns, function(b) { b.disabled = true; });

      // 显示解释
      var q = B.questions[B.idx];
      var lang = getLang();
      var explain = (q.ex && (q.ex[lang] || q.ex.en)) || q.explain || '';
      if (explain) {
        document.getElementById('battleExplain').innerHTML =
          T('battle.answer_prefix','Answer: ') + '<b>' + (correct + 1) + '</b> · ' + explain;
        document.getElementById('battleExplain').classList.add('show');
      }

      // 高亮 Bot 的选择
      var botChoice = B._botChoice;
      if (typeof botChoice === 'number' && btns[botChoice] && !btns[botChoice].classList.contains('correct') && !btns[botChoice].classList.contains('wrong')) {
        if (B.botCorrect) btns[botChoice].classList.add('correct');
        else btns[botChoice].classList.add('wrong');
      }

      updateScores();
      setTimeout(showNextButton, 800);
    }

    function onUserTimeout() {
      B.answered = true;
      if (B.botThinkTimer) { clearTimeout(B.botThinkTimer); B.botThinkTimer = null; }
      document.getElementById('battleBotThinking').style.display = 'none';
      var btns = document.querySelectorAll('.battle-opt');
      var correct = B.questions[B.idx].ans;
      if (btns[correct]) btns[correct].classList.add('correct');
      Array.prototype.forEach.call(btns, function(b) { b.disabled = true; });
      var q = B.questions[B.idx];
      var lang = getLang();
      var explain = (q.ex && (q.ex[lang] || q.ex.en)) || q.explain || '';
      if (explain) {
        document.getElementById('battleExplain').innerHTML =
          T('battle.timeout_prefix','⏰ Time\'s up! ') + T('battle.answer_prefix','Answer: ') + '<b>' + (correct + 1) + '</b> · ' + explain;
        document.getElementById('battleExplain').classList.add('show');
      }
      // Bot 可能已经抢答加分了
      setTimeout(showNextButton, 400);
    }

    function showNextButton() {
      var isLast = B.idx >= B.questions.length - 1;
      var html = '<button class="btn" id="battleNext">' + (isLast ? T('battle.see_result','See Result') : T('battle.next','Next →')) + '</button>';
      document.getElementById('battleActions').innerHTML = html;
      document.getElementById('battleNext').addEventListener('click', function() {
        B.idx++;
        updateScores();
        nextQuestion();
      });
    }

    function finishBattle() {
      clearInterval(B.timer);
      if (B.botThinkTimer) { clearTimeout(B.botThinkTimer); B.botThinkTimer = null; }
      document.getElementById('battleBotThinking').style.display = 'none';
      var outcome, title;
      if (B.youScore > B.botScore) { outcome = 'win'; title = T('battle.you_win','🎉 You win!'); }
      else if (B.youScore < B.botScore) { outcome = 'lose'; title = T('battle.you_lose','😔 You lose. Try again!'); }
      else { outcome = 'draw'; title = T('battle.draw','🤝 Draw!'); }
      var youVal = B.youScore;
      var botVal = B.botScore;
      var total = B.questions.length;
      var card = document.getElementById('battleCard');
      card.innerHTML =
        '<div class="battle-result ' + outcome + '">' +
          '<h2>' + title + '</h2>' +
          '<div class="battle-scores">' +
            '<div class="score-card you"><div class="score-name">' + T('train.you_label','You') + '</div><div class="score-val">' + youVal + '</div></div>' +
            '<div class="vs-badge">VS</div>' +
            '<div class="score-card bot"><div class="score-name">' + document.getElementById('battleBotName').textContent + '</div><div class="score-val">' + botVal + '</div></div>' +
          '</div>' +
          '<div class="score-big">' + youVal + ' : ' + botVal + '</div>' +
          '<p style="color:#6b7280;margin-top:8px">' + T('train.total_questions','Total {n} questions · You got {y} right').replace('{n}', total).replace('{y}', youVal) + '</p>' +
          '<div class="battle-actions">' +
            '<button class="btn" onclick="location.reload()">🔁 ' + T('train.battle_retry','Play again') + '</button>' +
            '<button class="btn ghost" onclick="location.href=\'/\'">← ' + T('battle.back_lobby','Back to Lobby') + '</button>' +
          '</div>' +
        '</div>';
    }

    function startAiBattle(category) {
      // Fast single-category load (avoid waiting for 12×2000 serial ensureLoaded)
      var Q = window.MemoryDuelQuiz;
      if (!Q || !Q.fetchBundle) {
        // quiz-data.js still loading: wait for memoryduel-quiz-ready
        window.addEventListener('memoryduel-quiz-ready', function once() {
          startAiBattle(category);
        }, { once: true });
        return;
      }
      // Sync quiz lang to ?lang / i18n before any fetch (do not use static html lang —
      // markup defaults to en and would clobber a stored zh preference).
      try {
        var want = params.get('lang')
          || ((window.i18n && window.i18n.getLang) ? window.i18n.getLang() : null);
        if (want && Q.setLang) Q.setLang(want);
      } catch (e) {}
      // 1) Already loaded for current lang? Use cache (skip wrongly-langued cache via _rawLang)
      var pool = (Q.byCategory && Q.byCategory(category)) || [];
      var curLang = (Q.getLang && Q.getLang()) || 'en';
      pool = pool.filter(function (q) { return !q._rawLang || q._rawLang === curLang; });
      if (pool.length > 0) { startBattle(pool); return; }
      // 2) Fast-path: fetch only this category (count=60, ~0.4s)
      Q.fetchBundle(category, 1).then(function(arr) {
        // Push to QUESTIONS so byCategory works on retry
        if (arr && arr.length > 0) {
          for (var i = 0; i < arr.length; i++) Q.QUESTIONS.push(arr[i]);
        }
        var pool2 = (Q.byCategory && Q.byCategory(category)) || [];
        pool2 = pool2.filter(function (q) { return !q._rawLang || q._rawLang === curLang; });
        if (pool2.length > 0) startBattle(pool2);
        else showError('"' + category + '" ' + T('battle.quiz_empty_inline','Quiz bank is empty. Please choose another category.'));
      }).catch(function() {
        showError(T('battle.load_failed','Failed to load quiz data. Please refresh and try again.'));
      });
    }

    /* ===== 在线对战（真实服务端:匹配建房 → 开局发题 → 服务端判分）===== */
    var PID = ''; // 会话签发后由 ensureSession 填充(F-010,不再用客户端自造 id)
    var OL = {
      code: '', category: 'general', totalRounds: 10,
      questions: [], idx: 0, myScore: 0, oppScore: 0, oppName: '',
      timer: null, timerStart: 0, answered: false,
      pollTimer: null, statusTimer: null, isHost: false,
    };

    function escHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function mdApi(method, path, body, retry) {
      return ensureSession().then(function (s) {
        var opts = { method: method, headers: { 'X-Player-ID': s.pid, 'X-Player-Token': s.token } };
        if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
        var apiPath = (typeof window !== 'undefined' && window.API_BASE ? window.API_BASE + path : path);
        return fetch(apiPath, opts).then(function (r) { return r.json(); }).then(function (j) {
          // 会话失效(KV 过期/清库)→ 清缓存重新签发并重试一次
          if (!j || !j.ok) {
            if (j && j.error && j.error.code === 'UNAUTHORIZED' && !retry) {
              try { localStorage.removeItem('md_session'); } catch (e) {}
              sessionPromise = null;
              /* P1-2（2026-10-06）：重试会用**新签发**的 pid，而 PID 变量仍停在旧值。
                 于是所有 `p.pid === PID` 的比较（对手识别、是否已在房内）全部失配，
                 且新 pid 是非房内成员 → 服务端不再下发 players。
                 重试前先把 PID 同步成新值。 */
              return ensureSession().then(function (s) { PID = s.pid; return mdApi(method, path, body, true); });
            }
            throw new Error((j && j.error && (j.error.msg || j.error.code)) || 'api_error');
          }
          return j.data;
        });
      });
    }

    // 会话(F-010): pid/token 由服务端签发并配对, 不再自造 Math.random 身份
    var sessionPromise = null;
    function ensureSession() {
      if (sessionPromise) return sessionPromise;
      sessionPromise = (function () {
        var s = null;
        try { s = JSON.parse(localStorage.getItem('md_session') || 'null'); } catch (e) {}
        if (s && s.pid && s.token) return Promise.resolve(s);
        return fetch((window.API_BASE || '') + '/api/md/session', { method: 'POST', headers: { 'Content-Type': 'application/json' } })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            if (!j || !j.ok || !j.data || !j.data.pid) throw new Error('session failed');
            s = { pid: j.data.pid, token: j.data.token };
            try { localStorage.setItem('md_session', JSON.stringify(s)); } catch (e) {}
            return s;
          });
      })();
      return sessionPromise;
    }

    // 在线路径报错:先清理等待卡/轮询,再走通用 showError
    function olShowError(msg) {
      olCleanup();
      showError(msg);
    }

    function olCleanup() {
      if (OL.statusTimer) { clearInterval(OL.statusTimer); OL.statusTimer = null; }
      if (OL.pollTimer) { clearInterval(OL.pollTimer); OL.pollTimer = null; }
      if (OL.timer) clearInterval(OL.timer);
      var wc = document.getElementById('olWaitingCard');
      if (wc && wc.parentNode) wc.parentNode.removeChild(wc);
      var bc = document.getElementById('battleCard');
      if (bc) bc.style.display = '';
    }

    function startOnlineRoom(roomCode) {
      var code = String(roomCode || '').trim().toUpperCase();
      // 只接受服务端房间码格式(6 位大写字母/数字),伪造房间码直接报错
      if (!/^[A-Z2-9]{6}$/.test(code)) {
        olShowError(T('lobby.invalid_room_code','Invalid room code (must be 6 uppercase letters or digits).'));
        return;
      }
      OL.code = code;
      ensureSession().then(function (s) { PID = s.pid; joinRoomFlow(); })
        .catch(function () { olShowError(T('lobby.session_init_failed','Session init failed. Please refresh and retry.')); });
    }

    // 全站曾经一律叫 'Player'：排行榜上一片同名，服务端又按名字复用座位。
    // 现在取账号名；还没取名就生成一个唯一的，绝不回落成 'Player'。
    function mdName() {
      var I = window.Identity;
      var n = (I && I.current && I.current()) || '';
      if (!n) { try { n = localStorage.getItem('mm_name') || ''; } catch (e) {} }
      if (n) return n;
      n = 'Player-' + Math.random().toString(36).slice(2, 6);
      try { localStorage.setItem('mm_name', n); } catch (e) {}
      return n;
    }

    function joinRoomFlow() {
      mdApi('POST', '/api/md/room/join', { code: OL.code, name: mdName() })
        .then(function (room) { showWaiting(room); })
        .catch(function (err) {
          // join 失败 → 查状态:已开局则断线重连拉题;已在房间(预加入)则进等待室;否则报错
          mdApi('GET', '/api/md/room/status?code=' + encodeURIComponent(OL.code))
            .then(function (st) {
              if (st.status === 'playing') return fetchQuestions();
              var mine = (st.players || []).some(function (p) { return p.pid === PID; });
              if (mine) return showWaiting(st);
              throw err;
            })
            .catch(function () { olShowError(T('lobby.room_not_found','Room not found, full, or expired.') + ' (' + err.message + ')'); });
        });
    }

    function showWaiting(room) {
      OL.isHost = !!(room.players[0] && room.players[0].pid === PID);
      OL.category = room.category || 'general';
      OL.totalRounds = room.rounds || room.totalRounds || 10;
      var opp = null;
      room.players.forEach(function (p) { if (p.pid !== PID && !opp) opp = p; });
      if (opp) OL.oppName = opp.name;
      var zh = getLang() === 'zh';
      var stage = document.getElementById('battleStage');
      stage.classList.add('active');
      // 隐藏对战面板(其子元素是渲染必需的,不能销毁),等待室用独立卡片
      document.getElementById('battleCard').style.display = 'none';
      var waitEl = document.getElementById('olWaitingCard');
      if (!waitEl) {
        waitEl = document.createElement('div');
        waitEl.className = 'battle-card';
        waitEl.id = 'olWaitingCard';
        stage.appendChild(waitEl);
      }
      var namesHtml = room.players.map(function (p) {
        return '<div class="score-card ' + (p.pid === PID ? 'you' : 'bot') + '"><div class="score-name">' +
          escHtml(p.name) + (p.host ? ' 👑' : '') + '</div><div class="score-val">' +
          (p.pid === PID ? T('train.you_label','You') : 'P2') + '</div></div>';
      }).join('<div class="vs-badge">VS</div>');
      var startBox = OL.isHost
        ? '<button class="btn" id="olStart">▶ ' + T('room.start_battle','Start Battle') + '</button>'
        : '<p style="color:#6b7280">' + T('room.waiting_host','Waiting for host to start…') + '</p>';
      waitEl.innerHTML =
        '<div style="text-align:center;padding:30px 16px">' +
          '<h2 style="margin-bottom:8px">🌐 Room ' + escHtml(OL.code) + '</h2>' +
          '<h3 style="margin-bottom:16px">' + T('room.room_ready','Room Ready') + '</h3>' +
          '<div class="battle-scores">' + namesHtml + '</div>' +
          '<div id="olWaitBox" style="margin-top:18px">' + startBox + '</div>' +
          '<div class="battle-actions" style="margin-top:16px"><button class="btn ghost" onclick="location.href=\'/\'">← ' + T('battle.back_lobby','Back to Lobby') + '</button></div>' +
        '</div>';
      var sb = document.getElementById('olStart');
      if (sb) sb.addEventListener('click', hostStart);
      // 轮询:开局后自动进入对局
      if (OL.statusTimer) clearInterval(OL.statusTimer);
      OL.statusTimer = setInterval(function () {
        mdApi('GET', '/api/md/room/status?code=' + encodeURIComponent(OL.code)).then(function (st) {
          if (st.status === 'playing') {
            clearInterval(OL.statusTimer); OL.statusTimer = null;
            fetchQuestions();
          }
        }).catch(function () {});
      }, 2000);
    }

    function hostStart() {
      mdApi('POST', '/api/md/room/start', { code: OL.code, category: OL.category, lang: getLang(), rounds: OL.totalRounds })
        .then(function (d) { beginOnlineBattle(d.questions); })
        .catch(function (err) { olShowError(T('room.start_failed','Start failed: ') + err.message); });
    }

    function fetchQuestions() {
      mdApi('GET', '/api/md/room/questions?code=' + encodeURIComponent(OL.code))
        .then(function (d) { beginOnlineBattle(d.questions); })
        .catch(function (err) { olShowError(T('room.fetch_questions_failed','Failed to load questions: ') + err.message); });
    }

    function beginOnlineBattle(questions) {
      if (OL.statusTimer) { clearInterval(OL.statusTimer); OL.statusTimer = null; }
      if (!questions || !questions.length) { olShowError(T('room.bank_empty','Quiz bank is empty. Cannot start.')); return; }
      // 收起等待室,恢复对战面板
      var wc = document.getElementById('olWaitingCard');
      if (wc && wc.parentNode) wc.parentNode.removeChild(wc);
      document.getElementById('battleCard').style.display = '';
      OL.questions = questions;
      OL.idx = 0; OL.myScore = 0; OL.oppScore = 0; OL.answered = false;
      document.getElementById('battleTitle').innerHTML = '🌐 Room ' + escHtml(OL.code);
      document.getElementById('battleTotal').textContent = questions.length;
      document.getElementById('battleYouName').textContent = T('train.you_label','You');
      document.getElementById('battleBotName').textContent = OL.oppName || 'Opponent';
      document.getElementById('battleBotThinking').style.display = 'none';
      updateOnlineScores();
      renderOnlineQuestion();
      startOppPolling();
    }

    function updateOnlineScores() {
      document.getElementById('battleYouScore').textContent = OL.myScore;
      document.getElementById('battleBotScore').textContent = OL.oppScore;
      document.getElementById('battleCur').textContent = (OL.idx + 1);
    }

    function renderOnlineQuestion() {
      if (OL.idx >= OL.questions.length) { finishOnline(); return; }
      OL.answered = false;
      var q = OL.questions[OL.idx];
      var options = q.options || [];
      document.getElementById('battleQuestion').textContent = q.q || '';
      document.getElementById('battleExplain').classList.remove('show');
      document.getElementById('battleExplain').innerHTML = '';
      document.getElementById('battleBotThinking').style.display = 'none';
      document.getElementById('battleActions').innerHTML = '';
      var letters = ['A','B','C','D','E','F'];
      var optsHtml = '';
      for (var i = 0; i < options.length; i++) {
        optsHtml += '<button class="battle-opt" data-idx="' + i + '">' +
          '<span class="opt-letter">' + (letters[i] || '?') + '</span>' +
          '<span>' + escHtml(options[i]) + '</span></button>';
      }
      var optsEl = document.getElementById('battleOptions');
      optsEl.innerHTML = optsHtml;
      Array.prototype.forEach.call(optsEl.querySelectorAll('.battle-opt'), function (btn) {
        btn.addEventListener('click', function () { onOnlineAnswer(parseInt(btn.dataset.idx, 10)); });
      });
      startOnlineTimer();
    }

    function startOnlineTimer() {
      OL.timerStart = Date.now();
      if (OL.timer) clearInterval(OL.timer);
      var fill = document.getElementById('battleTimerFill');
      var val = document.getElementById('battleTimerVal');
      OL.timer = setInterval(function () {
        var left = Math.max(0, PER_QUESTION_MS - (Date.now() - OL.timerStart));
        fill.style.width = (left / PER_QUESTION_MS * 100) + '%';
        val.textContent = Math.ceil(left / 1000);
        if (left <= 0) { clearInterval(OL.timer); if (!OL.answered) onOnlineTimeout(); }
      }, 100);
    }

    function onOnlineAnswer(idx) {
      if (OL.answered) return;
      OL.answered = true;
      clearInterval(OL.timer);
      var ms = Date.now() - OL.timerStart;
      var btns = document.querySelectorAll('#battleOptions .battle-opt');
      Array.prototype.forEach.call(btns, function (b) { b.disabled = true; });
      mdApi('POST', '/api/md/answer', { code: OL.code, round: OL.idx, option: idx, ms: ms })
        .then(function (r) {
          if (r.score !== undefined) OL.myScore = r.score;
          var key = (r.answerKey !== undefined && r.answerKey !== null) ? r.answerKey : -1;
          if (btns[key]) btns[key].classList.add('correct');
          if (!r.correct && btns[idx]) btns[idx].classList.add('wrong');
          updateOnlineScores();
          showOnlineNext('');
        })
        .catch(function (err) {
          // 提交失败(网络/房间异常):本题不判分,允许继续
          showOnlineNext(T('battle.submit_failed','Submit failed: ') + err.message);
        });
    }

    function onOnlineTimeout() {
      OL.answered = true;
      var btns = document.querySelectorAll('#battleOptions .battle-opt');
      Array.prototype.forEach.call(btns, function (b) { b.disabled = true; });
      var zh = getLang() === 'zh';
      document.getElementById('battleExplain').innerHTML =
        '<b>⏰ ' + T('battle.timeout_prefix','⏰ Time\'s up! ').replace(/ .*$/,'') + '</b>' + T('battle.timeout_no_score','No score for this question.');
      document.getElementById('battleExplain').classList.add('show');
      showOnlineNext('');
    }

    function showOnlineNext(errMsg) {
      var isLast = OL.idx >= OL.questions.length - 1;
      var zh = getLang() === 'zh';
      var html = '';
      if (errMsg) html += '<p style="color:#dc2626;font-size:13px;margin:0 0 8px">' + escHtml(errMsg) + '</p>';
      html += '<button class="btn" id="olNext">' + (isLast ? T('battle.see_result','See Result') : T('battle.next','Next →')) + '</button>';
      document.getElementById('battleActions').innerHTML = html;
      document.getElementById('olNext').addEventListener('click', function () {
        OL.idx++;
        updateOnlineScores();
        renderOnlineQuestion();
      });
    }

    function startOppPolling() {
      if (OL.pollTimer) clearInterval(OL.pollTimer);
      OL.pollTimer = setInterval(function () {
        mdApi('GET', '/api/md/room/status?code=' + encodeURIComponent(OL.code)).then(function (st) {
          /* 健壮：服务端自 2026-10-06 起对**非房内成员**不再下发 players。
             本页的 PID 一旦落后于实际使用的 pid（例如 mdApi 遇 UNAUTHORIZED
             重新签发），这里就变成非成员 → st.players 为 undefined → forEach
             抛 TypeError → 被下面空 catch 吞掉 → 比分永远冻结，玩家只看到一场
             不动的对局且毫无提示。故一律兜底成空数组。 */
          var ps = st.players || [];
          var opp = null;
          ps.forEach(function (p) { if (p.pid !== PID && !opp) opp = p; });
          if (opp) {
            OL.oppScore = opp.score || 0;
            if (opp.name) document.getElementById('battleBotName').textContent = opp.name;
          }
          updateOnlineScores();
        }).catch(function () {});
      }, 2500);
    }

    function finishOnline() {
      clearInterval(OL.timer);
      if (OL.pollTimer) { clearInterval(OL.pollTimer); OL.pollTimer = null; }
      var zh = getLang() === 'zh';
      /* 结算：这是 memoryduel **唯一**的发币入口（服务端 /room/finish 按 players 发币）。
         此前是 fire-and-forget（.catch(function(){})），失败时用户看不到任何提示 ——
         会话失效/网络抖动导致没结算时，整局白打且金币永久丢失。
         这里等结果：失败就停在结算屏上说明原因，成功才继续展示比分。 */
      mdApi('POST', '/api/md/room/finish', { code: OL.code }).then(function () {
        finishOnlineShowResult();
      }).catch(function (err) {
        finishOnlineShowResult(err && err.message ? err.message : 'finish_failed');
      });
    }

    function finishOnlineShowResult(finishErr) {
      var youVal = OL.myScore, botVal = OL.oppScore, total = OL.questions.length;
      var outcome, title;
      if (youVal > botVal) { outcome = 'win'; title = T('battle.you_win','🎉 You win!'); }
      else if (youVal < botVal) { outcome = 'lose'; title = T('battle.you_lose','😔 You lose. Try again!'); }
      else { outcome = 'draw'; title = T('battle.draw','🤝 Draw!'); }
      var card = document.getElementById('battleCard');
      card.innerHTML =
        '<div class="battle-result ' + outcome + '">' +
          '<h2>' + title + '</h2>' +
          '<div class="battle-scores">' +
            '<div class="score-card you"><div class="score-name">' + T('train.you_label','You') + '</div><div class="score-val">' + youVal + '</div></div>' +
            '<div class="vs-badge">VS</div>' +
            '<div class="score-card bot"><div class="score-name">' + escHtml(document.getElementById('battleBotName').textContent) + '</div><div class="score-val">' + botVal + '</div></div>' +
          '</div>' +
          '<div class="score-big">' + youVal + ' : ' + botVal + '</div>' +
          /* 结算失败必须让用户看见：这一局的服务端发币没有发生。
             不加提示的话玩家会以为正常结束，金币凭空少掉且无从追查。 */
          (finishErr
            ? '<p style="color:#dc2626;margin-top:12px;font-size:13px">⚠️ ' +
              escHtml(T('train.finish_failed', 'Settlement failed: ') + finishErr) + '</p>'
            : '') +
          '<p style="color:#6b7280;margin-top:8px">' + T('train.summary_p1','Total ') + total + T('train.summary_p2',' questions · You scored <b style="color:#4f46e5">') + youVal + '</b></p>' +
          '<div class="battle-actions">' +
            '<button class="btn" onclick="location.href=\'/\'">🏠 ' + T('battle.back_lobby','Back to Lobby') + '</button>' +
          '</div>' +
        '</div>';
    }

    function bootBattle() {
      if (mode === 'ai') startAiBattle(cat);
      else if (room) startOnlineRoom(room);
    }
    /* Inline script runs before defer i18n/quiz-data. Wait for DOMContentLoaded
       (defer scripts have run) so ?lang + i18n are visible to getLang/setLang. */
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootBattle);
    } else {
      bootBattle();
    }
  })();
  </script>
